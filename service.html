<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Service — GestiON Afrique</title>
<link rel="icon" type="image/png" href="assets/gestion-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lora:ital@1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#C41E24;--red-dark:#9A171C;--ink:#111;--ink-soft:#55564F;--paper:#fff;--neutral:#F3F4F1;--line:#E4E3DF;--emerald:#1F7A5C;}
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;}
  h1,h2,h3{font-family:'Poppins',sans-serif;font-weight:700;margin:0;}
  .subtitle{font-family:'Lora',serif;font-style:italic;color:var(--ink-soft);}
  a{color:inherit;text-decoration:none;}
  .container{max-width:1120px;margin:0 auto;padding:0 32px;}
  .brand{display:inline-flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:18px;}
  .brand img{height:30px;width:30px;}
  .brand .bw{font-weight:700;}
  .brand .bl{font-weight:400;color:var(--ink-soft);margin-left:2px;}
  header{border-bottom:1px solid var(--line);padding:18px 0;}
  .nav{display:flex;justify-content:space-between;align-items:center;}
  .btn{background:var(--red);color:#fff;padding:12px 22px;border-radius:6px;font-weight:600;font-size:14px;border:none;cursor:pointer;display:inline-block;}
  .btn-outline{border:1.5px solid var(--ink);color:var(--ink);padding:12px 22px;border-radius:6px;font-weight:600;font-size:14px;display:inline-block;}

  .breadcrumb{font-size:13px;color:var(--ink-soft);padding:20px 0 0;}
  .breadcrumb a{color:var(--red);font-weight:600;}

  .hero{display:grid;grid-template-columns:56px 1fr;gap:20px;align-items:start;padding:24px 0 8px;}
  .hero .icon{width:56px;height:56px;border-radius:50%;background:#FBEAEA;display:flex;align-items:center;justify-content:center;}
  .hero .icon svg{width:28px;height:28px;stroke:var(--red);}
  .hero h1{font-size:32px;max-width:640px;}
  .hero .cat{font-size:13px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
  .hero p.lead{font-size:17px;color:var(--ink-soft);max-width:640px;margin-top:14px;}
  .validation-flag{display:inline-flex;align-items:center;gap:6px;background:#FBEAEA;color:#7A1418;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;margin-top:14px;}

  .cta-row{display:flex;gap:14px;margin:28px 0 10px;}

  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;padding:36px 0 90px;}
  .block{margin-bottom:36px;}
  .block h2{font-size:20px;margin-bottom:14px;}
  .includes{list-style:none;padding:0;margin:0;}
  .includes li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px;}
  .includes li svg{width:18px;height:18px;stroke:var(--emerald);flex:none;margin-top:1px;}

  .process-list{counter-reset:step;list-style:none;padding:0;margin:0;}
  .process-list li{counter-increment:step;padding:14px 0 14px 40px;position:relative;border-bottom:1px solid var(--line);font-size:14px;}
  .process-list li::before{content:counter(step);position:absolute;left:0;top:12px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .process-list li strong{display:block;font-size:14px;margin-bottom:2px;}

  .sidebar{background:var(--neutral);border-radius:12px;padding:26px;align-self:start;position:sticky;top:24px;}
  .sidebar .price{font-family:'Poppins',sans-serif;font-weight:700;font-size:22px;margin-bottom:4px;}
  .sidebar .price-note{font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
  .sidebar .btn{width:100%;text-align:center;margin-bottom:10px;}
  .sidebar .btn-outline{width:100%;text-align:center;}
  .sidebar hr{border:none;border-top:1px solid var(--line);margin:20px 0;}
  .sidebar .fact{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;color:var(--ink-soft);}
  .sidebar .fact strong{color:var(--ink);}

  .related{padding:0 0 90px;}
  .related h2{font-size:20px;margin-bottom:18px;}
  .related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .related-card{border:1px solid var(--line);border-radius:10px;padding:16px;font-size:13px;font-weight:600;}
  .related-card .icon-sm{width:30px;height:30px;border-radius:50%;background:#FBEAEA;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .related-card .icon-sm svg{width:15px;height:15px;stroke:var(--red);}

  @media (max-width:900px){.grid2{grid-template-columns:1fr;} .related-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a class="brand" href="index.html"><img src="assets/gestion-icon.png" alt=""><span class="bw">GestiON</span> <span class="bl">Afrique</span></a>
    <a class="btn" href="devis.html">Demander un devis</a>
  </div>
</header>

<div class="container breadcrumb"><a href="services.html">Catalogue de services</a> / <span id="crumb-name"></span></div>

<div class="container hero">
  <div class="icon" id="hero-icon"></div>
  <div>
    <div class="cat" id="hero-cat"></div>
    <h1 id="hero-title"></h1>
    <p class="lead" id="hero-desc"></p>
    <div id="validation-flag"></div>
    <div class="cta-row">
      <a class="btn" href="devis.html">Demander un devis</a>
      <a class="btn-outline" href="services.html">Voir tout le catalogue</a>
    </div>
  </div>
</div>

<div class="container grid2">
  <div>
    <div class="block">
      <h2>Ce qui est inclus</h2>
      <ul class="includes" id="includes-list"></ul>
    </div>
    <div class="block">
      <h2>Comment ça se passe</h2>
      <ol class="process-list" id="process-list"></ol>
    </div>
  </div>

  <div class="sidebar">
    <div class="price" id="sidebar-price"></div>
    <div class="price-note" id="sidebar-price-note"></div>
    <a class="btn" href="devis.html">Demander un devis</a>
    <a class="btn-outline" href="login.html">Voir dans mon espace</a>
    <hr>
    <div class="fact"><span>Délai habituel</span><strong id="fact-delay"></strong></div>
    <div class="fact"><span>Pays disponibles</span><strong>Bénin, France</strong></div>
    <div class="fact"><span>Validation humaine</span><strong id="fact-validation"></strong></div>
  </div>
</div>

<div class="container related">
  <h2>Voir aussi</h2>
  <div class="related-grid" id="related-grid"></div>
</div>

const PROCESS = [
  {t:"Décrivez votre besoin", d:"Un questionnaire court adapte les questions à votre secteur et à votre pays."},
  {t:"Recevez une estimation", d:"Une fourchette de prix indicative, puis un devis détaillé sur demande."},
  {t:"Signez et payez", d:"Signature électronique et paiement en ligne selon les moyens disponibles dans votre pays."},
  {t:"Suivez la mission", d:"Statut, tâches et documents demandés, visibles en direct depuis votre espace."},
];

function getSlug(){
  const match = window.location.search.match(/[?&]s=([^&]+)/);
  return match ? decodeURIComponent(match[1]) : 'comptabilite';
}

function render(){
  const slug = getSlug();
  const s = SERVICES[slug] || SERVICES.comptabilite;

  document.getElementById('page-title').textContent = s.name + ' — GestiON Afrique';
  document.getElementById('crumb-name').textContent = s.name;
  document.getElementById('hero-icon').innerHTML = ICONS[s.icon];
  document.getElementById('hero-cat').textContent = s.name;
  document.getElementById('hero-title').textContent = s.name;
  document.getElementById('hero-desc').textContent = s.desc;
  document.getElementById('validation-flag').innerHTML = s.validation
    ? '<span class="validation-flag">⚠ Nécessite la validation d\'un professionnel habilité avant tout envoi</span>' : '';

  document.getElementById('includes-list').innerHTML = s.includes.map(i => `<li>${CHECK}${i}</li>`).join('');
  document.getElementById('process-list').innerHTML = PROCESS.map(p => `<li><strong>${p.t}</strong>${p.d}</li>`).join('');

  document.getElementById('sidebar-price').textContent = s.price;
  document.getElementById('sidebar-price-note').textContent = s.priceNote;
  document.getElementById('fact-delay').textContent = s.delay;
  document.getElementById('fact-validation').textContent = s.validation ? 'Oui, systématique' : 'Non requise';

  const others = Object.keys(SERVICES).filter(k => k !== slug);
  const shuffled = others.sort(() => 0.5 - Math.random()).slice(0, 4);
  document.getElementById('related-grid').innerHTML = shuffled.map(k => `
    <a class="related-card" href="service.html?s=${k}">
      <div class="icon-sm">${ICONS[SERVICES[k].icon]}</div>
      ${SERVICES[k].name}
    </a>
  `).join('');
}
render();
</script>

</body>
</html>
